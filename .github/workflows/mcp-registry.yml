name: Publish to MCP Registry
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz -C /tmp mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/
          mcp-publisher --help | head -3
      - name: Authenticate via GitHub OIDC and publish
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
